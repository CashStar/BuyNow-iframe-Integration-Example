# Include this from your server block (e.g. `include /etc/nginx/snippets/buynow-headers.conf;`)
# inside the `location /` (or wherever index.html is served) for this site.
#
# Required so client sites can embed this page in an <iframe>. nginx does not add any
# framing-restriction headers by default, but add this explicitly rather than relying on
# that - and if an upstream ALB/WAF or shared nginx config already sets X-Frame-Options or
# a CSP, this will need to override/replace it for this host.
#
# Replace the frame-ancestors list with the actual client domains allowed to embed the
# widget - do NOT use '*' here, this is a checkout/payment surface and an open
# frame-ancestors policy exposes it to clickjacking (UI redress) attacks.
add_header Content-Security-Policy "frame-ancestors 'self' https://nordstrom.com https://client-two.example.com" always;

# Make sure no X-Frame-Options header is being sent (it takes precedence over
# frame-ancestors in older browsers and defaults to blocking all framing if set to DENY/SAMEORIGIN).
# `more_clear_headers` needs the headers-more-nginx-module; if that's not installed, instead just
# make sure nothing upstream (this nginx config, the ALB, a WAF) is already adding X-Frame-Options.
more_clear_headers 'X-Frame-Options';
